<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">
    <title>Câmara do Mestre - Administração</title>
    <style>
        :root { --fundo: #e6dabe; --cartao: #f4ecd8; --texto: #3b2a1a; --borda: #6b4c3a; --borda-fina: #a68a6b; --botao: #4a3627; --botao-hover: #312217; --carmesim: #8c2a2a; }
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background-color: var(--fundo); color: var(--texto); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 3px solid var(--borda); padding-bottom: 15px; }
        .header h1 { margin: 0; color: var(--carmesim); text-transform: uppercase; }
        
        button { font-family: 'Georgia', serif; background-color: var(--botao); color: var(--cartao); border: 2px solid var(--botao); padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: var(--botao-hover); }
        .btn-perigo { background-color: var(--carmesim); border-color: var(--carmesim); }
        
        .painel { width: 100%; max-width: 1000px; background-color: var(--cartao); border: 2px solid var(--borda); padding: 20px; margin-bottom: 25px; border-radius: 4px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .painel h3 { margin-top: 0; color: var(--botao); border-bottom: 1px dashed var(--borda-fina); padding-bottom: 5px; }
        
        .inputs-grupo { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        input { background: var(--fundo); border: 1px solid var(--borda); color: var(--texto); padding: 10px; font-family: 'Georgia', serif; flex: 1; min-width: 150px; }
        
        .grid-funcionarios { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card-func { background: var(--fundo); border: 1px solid var(--borda); padding: 15px; text-align: center; border-radius: 4px; }
        .card-func img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--borda); object-fit: cover; }
        .card-func p { margin: 5px 0; font-size: 0.9rem; border-bottom: 1px dashed var(--borda-fina); }
        
        .tag-classe { background: var(--borda); color: var(--cartao); padding: 5px 12px; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-del-classe { background: transparent; border: none; color: #ffcccc; font-size: 1.2rem; cursor: pointer; padding: 0; display: flex; align-items: center; }
        .item-lista { background: var(--cartao); border: 1px solid var(--borda); padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Câmara do Mestre 👑</h1>
        <div>
            <span>Modo Administrador</span>
            <button class="btn-perigo" style="margin-left: 10px;" onclick="realizarLogout()">Partir</button>
        </div>
    </div>

    <div class="painel">
        <h3>Forjar Novo Item</h3>
        <div class="inputs-grupo">
            <input type="text" id="add-nome" placeholder="Nome do Artefato">
            <input type="text" id="add-preco" placeholder="Preço">
            <input type="number" id="add-estoque" placeholder="Qtd. em Estoque" min="0">
            <input type="text" id="add-classe" placeholder="Classes (separadas por vírgula)">
            <input type="text" id="add-imagem" placeholder="Caminho/URL da Imagem">
        </div>
        <input type="text" id="add-descricao" placeholder="Descrição completa..." style="width: 100%; margin-bottom: 10px;">
        <button onclick="adicionarProdutoAdmin()">Forjar Item</button>
    </div>

    <div class="painel">
        <h3>Quadro de Súditos (Funcionários) 👥</h3>
        <div class="grid-funcionarios" id="grid-funcionarios"></div>
    </div>

    <div class="painel" style="background: transparent; border: none; box-shadow: none; padding: 0;">
        <h3>Artefatos do Reino (Gerenciar Estoque)</h3>
        <div id="catalogo-admin-container"></div>
    </div>

    <script>
        let produtosServidor = [];
        let classesServidor = [];

        const listaFuncionarios = [
            { nome: "John", funcao: "Caixa", genero: "Masculino", idade: 20, cpf: "111.111.111-11", foto: "Imagens/perfil.png" },
            { nome: "Thyago", funcao: "Estoquista", genero: "Masculino", idade: 31, cpf: "222.222.222-22", foto: "Imagens/perfil.png" },
            { nome: "Rodrigo", funcao: "Atendente", genero: "Masculino", idade: 19, cpf: "121.121.121-12", foto: "Imagens/perfil.png" },
            { nome: "Ronald", funcao: "Gerente", genero: "Masculino", idade: 27, cpf: "212.212.212-21", foto: "Imagens/perfil.png" }
        ];

        function carregarFuncionarios() {
            const grid = document.getElementById("grid-funcionarios");
            listaFuncionarios.forEach(func => {
                grid.innerHTML += `
                    <div class="card-func">
                        <img src="${func.foto}" alt="${func.nome}">
                        <h4 style="margin:10px 0 5px 0;">${func.nome}</h4>
                        <p style="color: var(--carmesim);"><strong>${func.funcao}</strong></p>
                        <p>Gênero: <strong>${func.genero}</strong></p>
                        <p>Idade: <strong>${func.idade}</strong></p>
                        <p>Documento: <strong>${func.cpf}</strong></p>
                    </div>
                `;
            });
        }

        function verificarUsuario() {
            if (localStorage.getItem('usuarioAtivo') !== 'admin') { window.location.href = "/"; return; }
            carregarFuncionarios();
            requisitarDados();
        }

        function realizarLogout() { localStorage.removeItem('usuarioAtivo'); window.location.href = "/"; }

        function requisitarDados() {
            Promise.all([
                fetch('/api/classes', { cache: 'no-store' }).then(res => res.json()),
                fetch('/api/produtos', { cache: 'no-store' }).then(res => res.json())
            ]).then(([classes, produtos]) => {
                classesServidor = classes;
                produtosServidor = produtos;
                renderizarListaAdmin();
            });
        }

        function adicionarProdutoAdmin() {
            const dados = {
                nome: document.getElementById('add-nome').value, 
                preco: document.getElementById('add-preco').value,
                estoque: document.getElementById('add-estoque').value, 
                classe: document.getElementById('add-classe').value,
                descricao: document.getElementById('add-descricao').value, 
                imagem: document.getElementById('add-imagem').value
            };
            fetch('/api/produtos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) }).then(() => {
                document.querySelectorAll('.inputs-grupo input, #add-descricao').forEach(i => i.value = ''); requisitarDados();
            });
        }

        function removerProduto(id) { fetch(`/api/produtos/${id}`, { method: 'DELETE' }).then(() => requisitarDados()); }

        function salvarEstoque(idProduto) {
            const val = parseInt(document.getElementById(`estoque-${idProduto}`).value);
            if(isNaN(val) || val < 0) return alert("Valor inválido.");
            fetch(`/api/produtos/${idProduto}/estoque`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estoque: val }) })
            .then(() => alert("Estoque atualizado!")).then(() => requisitarDados());
        }

        function renderizarListaAdmin() {
            const container = document.getElementById("catalogo-admin-container");
            container.innerHTML = "";
            produtosServidor.forEach(item => {
                container.innerHTML += `
                    <div class="item-lista">
                        <div style="flex:1;"><strong>${item.nome}</strong> - ${item.preco}</div>
                        <div style="display:flex; gap:10px; align-items:center;">
                            Estoque: <input type="number" id="estoque-${item.id}" value="${item.estoque !== undefined ? item.estoque : 0}" style="width:70px; padding:5px;">
                            <button onclick="salvarEstoque('${item.id}')">Salvar</button>
                            <button class="btn-perigo" onclick="removerProduto('${item.id}')">Excluir</button>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = verificarUsuario;
    </script>
</body>
</html>
