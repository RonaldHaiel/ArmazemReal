<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">
    <title>Selar Acordo</title>
    <style>
        :root { --fundo: #e6dabe; --cartao: #f4ecd8; --texto: #3b2a1a; --borda: #6b4c3a; --borda-fina: #a68a6b; --botao: #4a3627; --botao-hover: #312217; --carmesim: #8c2a2a; --verde-musgo: #3a5a30; }
        
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background-color: var(--fundo); color: var(--texto); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--borda); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { margin: 0; color: var(--carmesim); text-transform: uppercase; }
        
        button, .btn-link { font-family: 'Georgia', serif; background: var(--botao); color: var(--cartao); border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; text-align: center; }
        button:hover, .btn-link:hover { background-color: var(--botao-hover); }
        .btn-link-voltar { background: var(--fundo); border: 2px solid var(--borda); color: var(--texto); }
        .btn-link-voltar:hover { background: var(--borda); color: var(--cartao); }

        .painel { width: 100%; max-width: 600px; background-color: var(--cartao); border: 2px solid var(--borda); padding: 30px; border-radius: 4px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .painel h3 { margin-top: 0; color: var(--texto); border-bottom: 1px dashed var(--borda-fina); padding-bottom: 10px; }
        
        .item-lista { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--borda-fina); padding: 10px 0; font-size: 1.1rem; }
        .item-lista:last-child { border-bottom: none; }
        
        .total-bloco { margin-top: 30px; text-align: center; border-top: 3px double var(--borda); padding-top: 20px; }
        .total-bloco h2 { color: var(--verde-musgo); margin: 10px 0 25px 0; font-size: 2rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Firmação de Contrato 📜</h1>
        <a href="inventario.html" class="btn-link btn-link-voltar">Retornar à Bolsa</a> 
    </div>

    <div class="painel">
        <h3>Resumo das Provisões</h3>
        
        <div id="lista-itens">
            <!-- Itens preenchidos via JS -->
        </div>

        <div class="total-bloco">
            <h3 style="border: none; margin: 0; padding: 0;">Valor Total do Acordo</h3>
            <h2 id="valor-total">A Calcular na Entrega</h2>
            <button style="background: var(--verde-musgo); font-size: 1.2rem; width: 100%; padding: 15px;" onclick="finalizarCompra()">Selar Acordo (Confirmar Pedido)</button>
        </div>
    </div>

    <script>
        function carregarResumo() {
            const user = localStorage.getItem('usuarioAtivo');
            if (!user) {
                alert("Aventureiro não identificado.");
                window.location.href = '/';
                return;
            }

            const itens = JSON.parse(localStorage.getItem(`inventario_${user}`)) || [];
            const listaItens = document.getElementById('lista-itens');
            
            if (itens.length === 0) {
                listaItens.innerHTML = '<p style="text-align:center; font-style:italic;">Não há itens no contrato. A bolsa está vazia.</p>';
                return;
            }

            itens.forEach(item => {
                listaItens.innerHTML += `
                    <div class="item-lista">
                        <span><strong>${item.nome}</strong></span>
                        <span style="color: var(--carmesim); font-weight: bold;">${item.preco}</span>
                    </div>
                `;
            });
        }

        function finalizarCompra() {
            const user = localStorage.getItem('usuarioAtivo');
            const itens = JSON.parse(localStorage.getItem(`inventario_${user}`)) || [];
            
            if (itens.length === 0) {
                alert("Você não pode selar um acordo sem provisões na bolsa.");
                return;
            }
            
            alert("Acordo selado com sucesso! As provisões estão a caminho de suas terras.");
            
            localStorage.removeItem(`inventario_${user}`);
            
            window.location.href = '/';
        }

        window.onload = carregarResumo;
    </script>
</body>
</html>
