<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon"> <!--icone da página-->
    <title>Armazém Real - Catálogo</title>
    <style>
        :root { /*declara formatos padrões que serão chamados ao longo do arquivo*/
            --fundo: #e6dabe;
            --cartao: #f4ecd8;
            --texto: #3b2a1a;
            --borda: #6b4c3a;
            --borda-fina: #a68a6b;
            --botao: #4a3627;
            --botao-hover: #312217; /*feedback visual quando o mouse está em cima do botão*/
            --carmesim: #8c2a2a;
            --verde-musgo: #3a5a30;
        }
        
        *, *::before, *::after { box-sizing: border-box; } /*faz com que margens e bordas fiquem dentro do tamanho definido e aplica a todos os elementos do código*/
        body { font-family: 'Georgia', 'Times New Roman', serif; background-color: var(--fundo); color: var(--texto); margin: 0; padding-top: 180px; }/*formata o body geral, já utilizando o root*/
        
        header { position: fixed; top: 0; left: 0; width: 100%; background-color: var(--cartao); border-bottom: 4px solid var(--borda); box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 1000; padding: 15px 25px; }/*formata o cabeçalho fixo no topo*/
        .header-topo { display: flex; justify-content: space-between; align-items: center; }
        .header-topo h1 { margin: 0; font-size: 1.8rem; color: var(--carmesim); text-transform: uppercase; letter-spacing: 2px; }
        .btn-menu { display: none; background: var(--botao); color: var(--cartao); border: none; padding: 8px 12px; font-size: 1.2rem; cursor: pointer; border-radius: 4px; }/*cabeçalho/menu para telefone*/
        
        .nav-conteudo { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--borda-fina); }/*formata e estiliza a barra de busca*/
        .busca-container input { background-color: var(--fundo); border: 2px solid var(--borda); color: var(--texto); padding: 10px; border-radius: 4px; font-family: 'Georgia', serif; min-width: 250px; }
        
        button, .btn-link { font-family: 'Georgia', serif; background-color: var(--botao); color: var(--cartao); border: 2px solid var(--botao); padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }/*estiliza os botões*/
        button:hover, .btn-link:hover { background-color: var(--botao-hover); }
        .btn-vazado { background-color: transparent; color: var(--botao); border-color: var(--botao); }/*botão transparente*/
        .btn-perigo { background-color: var(--carmesim); border-color: var(--carmesim); }/*botão de atenção*/
        
        .filtros-container { display: flex; gap: 8px; flex-wrap: wrap; }/*botões de classe do cabeçalho*/
        .btn-filtro { background-color: var(--fundo); color: var(--texto); border: 1px solid var(--borda); }
        .btn-filtro.ativo { background-color: var(--borda); color: var(--cartao); }

        #catalogo-container { display: flex; flex-direction: column; gap: 20px; padding: 0 25px 30px; max-width: 1000px; margin: 0 auto; }/*base do catálogo, empilha os itens um em cima/baixo do outro*/
        .item-card { background-color: var(--cartao); border: 2px solid var(--borda); border-radius: 4px; padding: 20px; box-shadow: 2px 2px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 12px; }/*cartão geral de cada item*/
        .item-titulo { font-size: 1.5rem; margin: 0; color: var(--carmesim); border-bottom: 1px solid var(--borda-fina); padding-bottom: 5px; }
        .item-tag { background-color: var(--borda); color: var(--cartao); font-size: 0.8rem; padding: 3px 8px; border-radius: 12px; text-transform: uppercase; }/*"medalhas" de categoria dos itens*/
        .item-preco { font-weight: bold; color: var(--verde-musgo); font-size: 1.4rem; }/*texto do preço*/
        
        /*bloco de controle dos pop-ups*/
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(59, 42, 26, 0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }/*escurece a página durante um pop-up*/
        .modal-content { background-color: var(--cartao); border: 4px solid var(--borda); padding: 30px; border-radius: 4px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; position: relative; }
        .modal-content h2 { margin: 0 0 10px 0; color: var(--carmesim); text-align: center; }
        .modal-content input { background: var(--fundo); border: 1px solid var(--borda); padding: 10px; font-family: 'Georgia', serif; }
        .btn-fechar { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.5rem; color: var(--carmesim); cursor: pointer; padding: 0; }

        /*bloco de estilo para telas menores, reduz margem superior, esconde cabeçalho permanente e mostra botão sancuíche*/
        @media (max-width: 768px) {
            body { padding-top: 100px; }
            .btn-menu { display: block; }
            .nav-conteudo { display: none; flex-direction: column; align-items: stretch; border-top: none; }
            .nav-conteudo.ativo { display: flex; border-top: 1px dashed var(--borda-fina); }
            .busca-container input { width: 100%; }
            .auth-area { display: flex; flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-topo">
            <h1>Armazém Real ⚔️</h1>
            <button class="btn-menu" onclick="document.getElementById('nav-menu').classList.toggle('ativo')">☰ Menu</button><!--chama o botão de menu por javascript-->
        </div>
        
        <div class="nav-conteudo" id="nav-menu">
            <div class="busca-container">
                <input type="text" id="campo-busca" placeholder="🔍 Buscar provisões..." oninput="carregarCatalogo()"><!--barra de busca que atualiza a cada click-->
            </div>
            
            <div class="filtros-container" id="container-botoes-filtros">
                <!--espaço onde os botões de categoria serão gerados por js-->
            </div>
            
            <div class="auth-area">
                <div id="auth-deslogado"><!--cria os botões de pop-up-->
                    <button class="btn-vazado" onclick="abrirModal('registro')">Alistar-se</button>
                    <button onclick="abrirModal('login')">Entrar</button>
                </div>
                <div id="auth-logado" style="display: none; align-items: center; gap: 10px; flex-wrap: wrap;"><!--esconde botões de registro/login e mostra inventário/sair-->
                    <span>Saudações, <strong id="nome-usuario-ativo" style="color: var(--carmesim);"></strong>!</span>
                    <a href="inventario.html" class="btn-link" id="btn-ver-inv-header">Sua Bolsa 🎒</a>
                    <button class="btn-perigo" onclick="realizarLogout()">Partir</button>
                </div>
            </div>
        </div>
    </header>

    <div id="catalogo-container"></div>

    <div id="modal-auth" class="modal-overlay">
        <div class="modal-content">
            <button class="btn-fechar" onclick="fecharModal()">&times;</button>
            <h2 id="modal-titulo">Acesso</h2>
            <input type="text" id="modal-user" placeholder="Nome de Usuário">
            <input type="email" id="modal-email" placeholder="E-mail">
            <input type="password" id="modal-pass" placeholder="Senha">
            <input type="password" id="modal-pass-confirm" placeholder="Confirme a Senha">
            <button onclick="processarFormulario()">Confirmar</button>
        </div>
    </div>

    <script>
        //define as variavéis e o banco de dados iniciais do site
        let classeAtiva = "todos";
        let modoModal = "login";
        let produtosServidor = [];
        let classesServidor = [];

        function abrirModal(modo) { //muda a janela de pop-up entre login/cadastro por "if/else"
            modoModal = modo;
            document.getElementById('modal-auth').style.display = 'flex';
            document.getElementById('modal-titulo').innerText = modo === 'login' ? 'Identifique-se' : 'Novo Registro';/*usa ? :*/
            document.getElementById('modal-email').style.display = modo === 'login' ? 'none' : 'block';
            document.getElementById('modal-pass-confirm').style.display = modo === 'login' ? 'none' : 'block';
        }

        function fecharModal() { document.getElementById('modal-auth').style.display = 'none'; }

        function processarFormulario() {/*função de login*/
            const user = document.getElementById('modal-user').value.trim();
            const pass = document.getElementById('modal-pass').value;
            if (!user || !pass) return alert("Preencha os campos.");

            if (modoModal === 'login' && user === 'admin' && pass === 'admin') {/*login padrão do admin*/
                localStorage.setItem('usuarioAtivo', 'admin');
                fecharModal();
                window.location.href = "admin.html";
                return;
            }

            /*banco de dados de usuário, baixa do servidor um arquivo editavel, edita e envia de volta*/
            let banco = JSON.parse(localStorage.getItem('usuariosCadastrados_v2')) || {};
            if (modoModal === 'registro') {
                if (user === 'admin') return alert("Nome reservado pelo reino.");/*impede registro de admin*/
                if (pass !== document.getElementById('modal-pass-confirm').value) return alert("Senhas não coincidem.");/*verifica se as senhas batem*/
                banco[user] = pass;
                localStorage.setItem('usuariosCadastrados_v2', JSON.stringify(banco));
                abrirModal('login');
            } else {
                if (banco[user] && banco[user] === pass) {/*confere se usuário e senha batem com o banco de dados*/
                    localStorage.setItem('usuarioAtivo', user);
                    fecharModal();
                    verificarUsuario();
                } else { alert("Credenciais inválidas."); }
            }
        }

        //atualiza a página após o login, direciona o admin para outra pagina
        function verificarUsuario() {
            const user = localStorage.getItem('usuarioAtivo');
            if (user === 'admin') { window.location.href = "admin.html"; return; }

            if (user) {
                document.getElementById('auth-deslogado').style.display = 'none';
                document.getElementById('auth-logado').style.display = 'flex';
                document.getElementById('nome-usuario-ativo').innerText = user;
            } else {
                document.getElementById('auth-deslogado').style.display = 'block';
                document.getElementById('auth-logado').style.display = 'none';
            }
            requisitarDadosDoServidor();
        }

        function realizarLogout() { localStorage.removeItem('usuarioAtivo'); verificarUsuario(); }

        //busca no servidor as categorias e os itens ao mesmo tempo e atribui ao banco de dados local
        function requisitarDadosDoServidor() {
            const fetchConfig = { cache: 'no-store' };
            Promise.all([
                fetch('/api/classes', fetchConfig).then(res => res.json()),
                fetch('/api/produtos', fetchConfig).then(res => res.json())
            ]).then(([classes, produtos]) => {
                classesServidor = classes; produtosServidor = produtos;
                renderizarAbasDeFiltro(); carregarCatalogo();
            }).catch(err => console.error("Erro nos pergaminhos:", err));
        }

        //cria os botões de filtro para cada categoria, + todos
        function renderizarAbasDeFiltro() {
            const container = document.getElementById('container-botoes-filtros');
            container.innerHTML = `<button class="btn-filtro ${classeAtiva === 'todos' ? 'ativo' : ''}" onclick="mudarFiltro('todos')">Todos</button>`;
            classesServidor.forEach(classe => {
                container.innerHTML += `<button class="btn-filtro ${classeAtiva === classe ? 'ativo' : ''}" onclick="mudarFiltro('${classe}')">${classe}</button>`;
            });
        }

        function mudarFiltro(classe) { classeAtiva = classe; requisitarDadosDoServidor(); }

        function carregarCatalogo() {
            const container = document.getElementById("catalogo-container");
            container.innerHTML = "";/*limpa o site para gerar a nova versão*/
            const user = localStorage.getItem('usuarioAtivo');
            const termo = document.getElementById('campo-busca').value.toLowerCase().trim();/*lê a busca de forma padronizada*/

            const filtrados = produtosServidor.filter(item => {
                return (classeAtiva === "todos" || item.classe.includes(classeAtiva)) && item.nome.toLowerCase().includes(termo);
            });/*filtro de busca, mostra apenas itens que possuem a categoria selecionada*/

            if (filtrados.length === 0) { container.innerHTML = '<p style="text-align:center;">Nenhum item encontrado nos baús.</p>'; return; }

            filtrados.forEach(item => {/*repete a estrutura a seguir pra cada item registrado*/
                const semEstoque = (item.estoque !== undefined ? item.estoque : 0) <= 0;/*verifica se há estoque*/
                const card = document.createElement("div");
                card.className = "item-card";
                
                // ` injeta as variavéis dentro da estrutura visual de cada item
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 class="item-titulo">${item.nome}</h3>
                        <div>${item.classe.map(c => `<span class="item-tag">${c}</span>`).join('')}</div>
                    </div>
                    <img src="${item.imagem}" alt="${item.nome}" style="width: 100%; height: 250px; object-fit: contain; border-radius: 4px; margin-top: 10px; border: 1px solid var(--borda-fina);">
                    <p style="margin:0;">${item.descricao}</p>
                    <p style="margin: 5px 0; font-weight: bold; color: ${semEstoque ? 'var(--carmesim)' : 'var(--verde-musgo)'};">
                        ${semEstoque ? '⚠️ Provisões Esgotadas' : `✅ Em Estoque`}
                    </p>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                        <span class="item-preco">${item.preco}</span>
                        <button ${!user || semEstoque ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''} class="btn-add">
                            ${!user ? 'Identifique-se' : (semEstoque ? 'Esgotado' : 'Guardar na Bolsa')}
                        </button>
                    </div>
                `;

                //função de compra com check de estoque
                if (user && !semEstoque) {
                    card.querySelector(".btn-add").addEventListener("click", () => {
                        let inv = JSON.parse(localStorage.getItem(`inventario_${user}`)) || [];
                        inv.push(item); /*envia os dados do item ao iventário*/
                        localStorage.setItem(`inventario_${user}`, JSON.stringify(inv));
                        alert(`"${item.nome}" foi guardado na sua bolsa!`);
                    });
                }
                container.appendChild(card);
            });
        }

        //começa à executar o js após tudo ser carregado
        window.onload = verificarUsuario;
    </script>
</body>
</html>
